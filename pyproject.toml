[project]
name = "hermes-loop-engineering"
version = "0.1.0"
description = "Hermes Loop 统一 CLI 薄调度器"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hermes-loop = "loop_engineering.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loop_engineering"]
